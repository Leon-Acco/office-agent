# Office_Agent nginx 反向代理配置
# 安装路径：/etc/nginx/conf.d/office-agent.conf
# 前提：systemd 服务监听 127.0.0.1:8000（APP_HOST=127.0.0.1）
#
# 关键点：
# 1. SSE 流式接口（/api/frontdesk/chat_stream 等）必须关闭缓冲，
#    否则前端收不到逐字输出
# 2. 读超时拉长，LLM 推理可能持续数分钟
# 3. 上传文件最大 50MB，与 backend file_service MAX_FILE_SIZE 对齐

upstream office_agent_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # 有域名时替换为实际域名

    # 上传限制 50MB（与后端一致）
    client_max_body_size 50m;

    location / {
        proxy_pass http://office_agent_backend;
        proxy_http_version 1.1;

        # 常规代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式必需：关闭代理缓冲 + 不缓存
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # LLM 推理耗时长：读超时 10 分钟，连接/发送超时常规值
        proxy_read_timeout 600s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        # SSE 禁用压缩（gzip 会缓冲输出）
        gzip off;
    }

    # 静态资源直接由后端 StaticFiles 提供即可（走上面的 / 代理），
    # 如需 nginx 直接出静态可取消注释并按部署路径调整：
    # location /static/ {
    #     alias /opt/office-agent/frontend/static/;
    #     expires 1h;
    # }
}
